<!-- Componente de acessibilidade -->
<div id="accessibility-btn" class="accessibility-btn">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-universal-access"
        viewBox="0 0 16 16">
        <path
            d="M9.5 1.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0M6 5.5l-4.535-.442A.531.531 0 0 1 1.531 4H14.47a.531.531 0 0 1 .066 1.058L10 5.5V9l.452 6.42a.535.535 0 0 1-1.053.174L8.243 9.97c-.064-.252-.422-.252-.486 0l-1.156 5.624a.535.535 0 0 1-1.053-.174L6 9z" />
    </svg>
</div>

<div id="accessibility-panel" class="accessibility-panel">
    <h5>Acessibilidade</h5>

    <div class="mb-2">
        <label class="form-label">Tamanho da fonte: <span id="a11y-font-value">100%</span></label><br>
        <button class="btn btn-sm btn-outline-primary me-1" onclick="changeFontSize('decrease')">A-</button>
        <button class="btn btn-sm btn-outline-primary" onclick="changeFontSize('increase')">A+</button>
    </div>

    <div class="mb-2">
        <label class="form-label">Espaçamento: <span id="a11y-spacing-value">100%</span></label><br>
        <button class="btn btn-sm btn-outline-secondary me-1" onclick="changeSpacing('decrease')">-</button>
        <button class="btn btn-sm btn-outline-secondary" onclick="changeSpacing('increase')">+</button>
    </div>
    
    <div class="mb-2">
        <button id="a11y-contrast-toggle" class="btn btn-sm btn-outline-dark w-100 mb-2">Ativar contraste</button>

        <button id="a11y-audio-toggle" aria-pressed="false" class="btn btn-sm btn-outline-dark w-100" aria-label="Ativar ou desativar leitor de áudio"></button>
    </div>
</div>
